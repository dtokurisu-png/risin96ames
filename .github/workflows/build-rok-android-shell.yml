name: Build ROK Android shell

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rok-apk-builder

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build shell APK
        working-directory: android-shell
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload shell artifact
        uses: actions/upload-artifact@v4
        with:
          name: rok-shell-apk
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
