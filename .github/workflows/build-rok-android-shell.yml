name: Build ROK Android shell

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rok-apk-builder
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build shell APK
        working-directory: android-shell
        run: gradle :app:assembleDebug --stacktrace

      - name: Publish shell APK branch
        run: |
          cp android-shell/app/build/outputs/apk/debug/app-debug.apk /tmp/ROK_shell.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B rok-apk-output origin/main
          mkdir -p generated-apk
          cp /tmp/ROK_shell.apk generated-apk/ROK_shell.apk
          git add generated-apk/ROK_shell.apk
          git commit -m 'Build ROK Android shell APK' || true
          git push --force origin rok-apk-output
