<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>R96 · Iniciando sesión</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:#070912;
      color:#f4f7ff;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    main{
      width:min(440px,100%);
      padding:30px;
      border:1px solid rgba(255,255,255,.11);
      border-radius:24px;
      background:rgba(255,255,255,.055);
      text-align:center;
    }
    .dot{
      width:14px;
      height:14px;
      margin:0 auto 18px;
      border-radius:50%;
      background:#00ffdf;
      box-shadow:0 0 28px rgba(0,255,223,.7);
      animation:pulse 1s ease-in-out infinite alternate;
    }
    h1{margin:0 0 9px;font-size:1.4rem}
    p{margin:0;color:#a9b3c7;line-height:1.55}
    .error{color:#ff9b9b}
    @keyframes pulse{to{opacity:.35;transform:scale(.78)}}
  </style>
</head>
<body>
  <main>
    <div class="dot"></div>
    <h1>Completando inicio de sesión</h1>
    <p id="status">Validando tu cuenta con Wix…</p>
  </main>
  <script type="module">
    import {
      completeOAuthCallback
    } from "../src/auth/r96-auth-core.js?v=2.0.3";

    const status = document.querySelector("#status");

    try {
      const returnUrl = await completeOAuthCallback();
      status.textContent = "Acceso confirmado. Regresando a R96…";
      location.replace(returnUrl);
    } catch (error) {
      console.error("[R96 auth] callback failed", error);
      status.className = "error";
      status.textContent =
        "No se pudo completar el inicio de sesión (" +
        String(error?.message || "R96_AUTH_CALLBACK_FAILED") +
        "). Regresa a R96 e inténtalo nuevamente.";
    }
  </script>
</body>
</html>
